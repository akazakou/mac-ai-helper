# ==============================================================================
# XcodeGen Project Specification for Mac AI Helper
# ==============================================================================
# Generates MacAIHelper.xcodeproj for xcodebuild-based builds.
# This ensures SPM resource bundles (e.g. KeyboardShortcuts localizations)
# are correctly placed in Contents/Resources/ within the .app bundle.
#
# Usage:
#   xcodegen generate      — creates MacAIHelper.xcodeproj
#   make dev               — full build + launch via xcodebuild
# ==============================================================================

name: MacAIHelper

options:
  bundleIdPrefix: com.castloud
  deploymentTarget:
    macOS: '14.0'
  xcodeVersion: '16.0'
  defaultConfig: Release
  groupSortPosition: top

# --- SPM Dependencies --------------------------------------------------------

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: '2.2.2'

# --- Build Configurations ----------------------------------------------------

configs:
  Debug: debug
  Release: release

# --- Targets -----------------------------------------------------------------

targets:
  # Library framework — all business logic, views, models, services.
  # Separated from the app target so tests can import it directly.
  MacAIHelperLib:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MacAIHelperLib
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        SWIFT_VERSION: '6.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.castloud.MacAIHelperLib
        PRODUCT_NAME: MacAIHelperLib
        SKIP_INSTALL: true
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'

  # Main application target — thin entry point + resources.
  MacAIHelper:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacAIHelper
    resources:
      - path: SupportFiles/menubar-icon.png
    dependencies:
      - target: MacAIHelperLib
        embed: true
    settings:
      base:
        SWIFT_VERSION: '6.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.castloud.MacAIHelper
        PRODUCT_NAME: MacAIHelper
        # Point to existing Info.plist and entitlements without xcodegen overwriting them
        INFOPLIST_FILE: SupportFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportFiles/MacAIHelper.entitlements
        GENERATE_INFOPLIST_FILE: false
        # Signing is handled by the Makefile; disable automatic signing here
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ''
        PROVISIONING_PROFILE_SPECIFIER: ''
        SWIFT_STRICT_CONCURRENCY: complete
        # Universal binary (arm64 + x86_64)
        ARCHS: '$(ARCHS_STANDARD)'
        ONLY_ACTIVE_ARCH: false

  # Unit test target
  MacAIHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacAIHelperTests
    dependencies:
      - target: MacAIHelperLib
    settings:
      base:
        SWIFT_VERSION: '6.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.castloud.MacAIHelperTests
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  MacAIHelper:
    build:
      targets:
        MacAIHelper: all
        MacAIHelperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacAIHelperTests
    archive:
      config: Release
