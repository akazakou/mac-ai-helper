# ==============================================================================
# XcodeGen Project Specification for Mac AI Helper
# ==============================================================================
# Generates MacAIHelper.xcodeproj for xcodebuild-based builds.
# This ensures SPM resource bundles (e.g. KeyboardShortcuts localizations)
# are correctly placed in Contents/Resources/ within the .app bundle.
#
# Usage:
#   xcodegen generate      — creates MacAIHelper.xcodeproj
# Release builds, signing and packaging run in GitHub Actions
# (.github/workflows/release.yml).
# ==============================================================================

name: MacAIHelper

options:
  bundleIdPrefix: com.castloud
  deploymentTarget:
    macOS: '14.0'
  xcodeVersion: '16.0'
  defaultConfig: Release
  groupSortPosition: top

# --- SPM Dependencies --------------------------------------------------------

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: '2.2.2'
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: '2.4.0'

# --- Build Configurations ----------------------------------------------------

configs:
  Debug: debug
  Release: release

# --- Targets -----------------------------------------------------------------

targets:
  # Library framework — all business logic, views, models, services.
  # Separated from the app target so tests can import it directly.
  MacAIHelperLib:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MacAIHelperLib
    dependencies:
      - package: KeyboardShortcuts
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        SWIFT_VERSION: '6.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.castloud.MacAIHelperLib
        PRODUCT_NAME: MacAIHelperLib
        SKIP_INSTALL: true
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: true
        Release:
          ONLY_ACTIVE_ARCH: false

  # Main application target — thin entry point + resources.
  MacAIHelper:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacAIHelper
    dependencies:
      - target: MacAIHelperLib
        embed: true
    settings:
      base:
        SWIFT_VERSION: '6.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.castloud.MacAIHelper
        PRODUCT_NAME: MacAIHelper
        # Point to existing Info.plist without xcodegen overwriting it
        INFOPLIST_FILE: SupportFiles/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
        # Universal binary (arm64 + x86_64) for Release
        ARCHS: '$(ARCHS_STANDARD)'
      configs:
        # Debug: "Sign to Run Locally" (ad-hoc) — no Apple Developer account needed
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: '-'
          ONLY_ACTIVE_ARCH: true
        # Release: unsigned build; signing is done by the GitHub Actions workflow
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: ''
          ONLY_ACTIVE_ARCH: false

  # Unit test target
  MacAIHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacAIHelperTests
    dependencies:
      - target: MacAIHelperLib
    settings:
      base:
        SWIFT_VERSION: '6.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.castloud.MacAIHelperTests
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  MacAIHelper:
    build:
      targets:
        MacAIHelper: all
        MacAIHelperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacAIHelperTests
    archive:
      config: Release
