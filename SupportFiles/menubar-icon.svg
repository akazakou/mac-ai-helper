<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- macOS menu bar template icon: monochrome black with alpha only.
       Set NSImage.isTemplate = true so the system tints for dark/light mode.
       Design: cursor + AI spark, matching the app icon motif. -->

  <!-- Cursor pointer (simplified) -->
  <path d="M3 1 L3 13 L5.8 10.5 L8.2 15 L9.8 14.2 L7.4 9.2 L11 9.2 Z"
        fill="#000000" fill-rule="evenodd"/>

  <!-- AI spark (4-point star) -->
  <path d="M13.5 2
           C13.8 4 13.8 4 15.5 4.5
           C13.8 5 13.8 5 13.5 7
           C13.2 5 13.2 5 11.5 4.5
           C13.2 4 13.2 4 13.5 2Z"
        fill="#000000"/>

  <!-- Small rays suggesting AI -->
  <line x1="15.5" y1="7.5" x2="17" y2="7.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="15.2" y1="9.5" x2="16.5" y2="10.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="15.2" y1="5.5" x2="16.5" y2="4.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
</svg>
