# ==============================================================================
# CodeQL code scanning for Mac AI Helper.
#
# Runs on GitHub-hosted runners. The Swift job cannot use the self-hosted
# Apple Silicon runner: CodeQL build tracing needs Rosetta 2, which is not
# installed there.
# ==============================================================================

name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    # Mondays 19:00 UTC: 1 pm Central Standard Time, 2 pm during daylight saving time.
    - cron: '0 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
            runner: macos-latest
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL analyzes only what is compiled here. One architecture is enough for analysis.
      - name: Build Swift package
        if: matrix.build-mode == 'manual'
        run: swift build --arch arm64

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
